<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>tests</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<pre id="results"></pre>
<script>
  window.__CC_DB_NAME__ = 'cuidador_canino_test_db';
  window.App = { go: function () {}, refresh: function () {}, updateBrand: function () {} };
</script>
<script src="../js/calc.js"></script>
<script src="../js/db.js"></script>
<script src="../js/templates.js"></script>
<script src="../js/crypto.js"></script>
<script src="../js/store.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/dogForm.js"></script>
<script src="../js/views/dashboard.js"></script>
<script src="../js/views/calendar.js"></script>
<script src="../js/views/dogs.js"></script>
<script src="../js/views/services.js"></script>
<script src="../js/views/settings.js"></script>
<script src="../js/views/reports.js"></script>
<script src="../js/views/plantillas.js"></script>
<script src="suite.js"></script>
<script>
'use strict';
var pre = document.getElementById('results');
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  pre.textContent += '\nUNHANDLED: ' + ((r && (r.stack || r.message)) ? (r.stack || r.message) : String(r));
});
window.__runSuite().then(function (res) {
  pre.textContent = res.lines.join('\n');
  document.title = res.fails === 0 ? 'PASS' : 'FAIL';
}).catch(function (e) {
  pre.textContent = 'FATAL: ' + (e && e.stack ? e.stack : String(e));
  document.title = 'FAIL';
});
</script>
</body>
</html>
